<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocketreel</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#14111f">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" hidden><img src="/icon.svg" width="88" alt=""><h1>Pocketreel</h1><p>All your short videos in one calm place.</p>
<input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
<div><button id="login">Log in</button><button id="signup" class="ghost">Create account</button></div><small id="aerr"></small></div>
<div id="app" hidden><header><img src="/icon.svg" width="32" alt=""><b>Pocketreel</b>
<form id="sf"><input id="q" type="search" placeholder="Search videos"></form><button id="home" class="ghost">Home</button><button id="gear" class="ghost">Settings</button></header>
<main id="feed"></main><div id="note"></div>
<aside id="set" hidden><h2>Settings</h2><h3>Accounts</h3><div id="plats"></div><h3>Playback</h3>
<label><input type="checkbox" id="autoplay"> Autoplay next video</label><label><input type="checkbox" id="muted"> Start muted</label>
<h3>Account</h3><button id="logout" class="ghost">Log out</button><button id="close">Done</button></aside></div>
<dialog id="cm"><form method="dialog"><textarea id="ct" rows="3" placeholder="Write a comment"></textarea><div><button value="x" class="ghost">Cancel</button><button id="send" value="go">Post</button></div></form></dialog>
<script src="/app.js"></script></body></html>
